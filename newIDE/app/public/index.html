    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: #000;
        background-image: none;
        background-repeat: no-repeat;
        overscroll-behavior: none;
      }


      /* Заставка VoxForge: показывается, пока загружается редактор. */
      #vf-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: radial-gradient(55% 45% at 50% 0%, rgba(255, 138, 61, 0.28), rgba(255, 138, 61, 0) 70%),
          radial-gradient(60% 50% at 50% 115%, rgba(138, 74, 198, 0.22), rgba(138, 74, 198, 0) 70%),
          #000;
        transition: opacity 700ms ease;
      }
      #vf-splash.vf-splash-hide { opacity: 0; pointer-events: none; }
      #vf-splash svg {
        width: 120px;
        height: 120px;
        animation: vf-splash-in 900ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .vf-splash-name {
        font-family: 'Unbounded', 'Segoe UI', system-ui, sans-serif;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: #f4ede5;
        animation: vf-splash-in 900ms 120ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .vf-splash-bar {
        width: 168px;
        height: 2px;
        overflow: hidden;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.12);
        animation: vf-splash-in 900ms 240ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .vf-splash-bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: linear-gradient(90deg, #ff8a3d, #ffc24b);
        animation: vf-splash-bar 1400ms ease-in-out infinite;
      }
      @keyframes vf-splash-in {
        from { opacity: 0; transform: translateY(10px) scale(0.97); }
        to { opacity: 1; transform: none; }
      }
      @keyframes vf-splash-bar {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }

      @keyframes text-focus-in {
        0% {
          -webkit-filter: blur(12px);
          filter: blur(12px);
          opacity: 0;
        }

        100% {
          -webkit-filter: blur(0px);
          filter: blur(0px);
          opacity: 1;
        }
      }
    </style>

    <script>
      // Заставку убираем, когда редактор появился (но не раньше чем через ~1 с,
      // чтобы она не мелькала).
      (function () {
        var splash = document.getElementById('vf-splash');
        if (!splash) return;
        var started = Date.now();
        var finished = false;
        function finish() {
          if (finished) return;
          finished = true;
          splash.classList.add('vf-splash-hide');
          setTimeout(function () { if (splash.parentNode) splash.parentNode.removeChild(splash); }, 800);
        }
        function check() {
          if (finished) return;
          if (document.querySelector('.main-frame') && Date.now() - started > 1000) finish();
          else setTimeout(check, 120);
        }
        check();
        setTimeout(finish, 60000); // на всякий случай, чтобы заставка не зависла
      })();
    </script>

    <script>
      window["GD_STARTUP_TIMES"] = [["indexHtmlFirstScriptStarted", performance.now()]];

      // Suppress benign errors.
      // This MUST be registered here (before any webpack bundle runs) so that
      // stopImmediatePropagation prevents react-error-overlay's handler.
      //
      // See also: Utils/SilenceBenignResizeObserverError.js.
      (function() {
        var lastLogTime = 0;
        window.addEventListener('error', function(event) {
          if (event.message === 'ResizeObserver loop completed with undelivered notifications.') {
            var now = Date.now();
            if (now - lastLogTime > 1000) {
              lastLogTime = now;
              console.log(
                'Silenced benign "ResizeObserver loop completed with undelivered notifications" error. ' +
                'This is a non-fatal browser warning (W3C spec): undelivered observations are deferred to the next frame.'
              );
            }
            event.stopImmediatePropagation();
          }
        });
      })();
    </script>
